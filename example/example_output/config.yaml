input:
  count_table: /mnt/hpccs01/work/microbiome/users/heyu/netinfer/example/coverM-genome_count.tsv
  relative_abundance_table: /mnt/hpccs01/work/microbiome/users/heyu/netinfer/example/coverm-genome_relativeabundance.tsv
  other_table: ''
  taxonomy_table: /mnt/hpccs01/work/microbiome/users/heyu/netinfer/example/MQMAGs_info.tsv
  metadata_table: ''
infer_taxonomy: false
include_negative: true
output_dir: /mnt/hpccs01/work/microbiome/users/heyu/netinfer/example/example_output
min_sample_depth: 1000
min_prevalence: 0.1
min_prevalent_samples: 0
min_peak_rel_abundance: 0.001
trusted_methods:
- flashweave
- flashweaveHE
- spieceasi
flashweave:
  enabled: true
  pvalue_threshold: 0.001
  weight_threshold: 0.4
  heterogeneous: false
  threads: 8
flashweaveHE:
  enabled: true
  pvalue_threshold: 0.001
  weight_threshold: 0.4
  heterogeneous: true
  threads: 8
spieceasi:
  enabled: true
  weight_threshold: 0.3
  method: mb
  threads: 8
fastspar:
  enabled: true
  pvalue_threshold: 0.05
  correlation_threshold: 0.2
  weight_threshold_filter: 0.3
  iterations: 50
  bootstraps: 1000
  threads: 8
spearman:
  enabled: true
  fdr_threshold: 0.05
  rho_threshold: 0.7
  threads: 8
pearson:
  enabled: true
  fdr_threshold: 0.05
  rho_threshold: 0.7
  threads: 8
propr:
  enabled: true
  rho_threshold: 0.7
  threads: 8
jaccard:
  enabled: true
  weight_threshold: 0.7
  threads: 8
visualization:
  enabled: true
suffix: ''
